name: New Umbraco releases

# Looks each day for new releases of the Umbraco major versions the package supports, and runs the tests on those
# releases only. A release that passes is added to UmbracoReleases on main, and the Release workflow publishes a package
# for it. A release that fails gets an issue. The jobs come from auroris/AurorisNet.Build, whose docs/releasing.md
# describes them.
on:
  schedule:
    - cron: '53 6 * * *'
  workflow_dispatch:
    inputs:
      releases:
        description: Releases to test instead of the new ones, separated by commas, such as 18.3.2,17.8.2
        required: false
        default: ''
      dry-run:
        description: Show the results in the run only, without a commit, a release or an issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: umbraco-releases
  cancel-in-progress: false

jobs:
  umbraco:
    uses: auroris/AurorisNet.Build/.github/workflows/umbraco-releases.yml@main
    permissions:
      actions: write
      contents: write
      issues: write
    with:
      runs-on: windows-latest
      # The three test projects, built against the release under test.
      test-command: >-
        foreach ($project in 'AppBlocks.Tests', 'AppBlocks.InteractiveReports.Tests', 'AppBlocks.Documents.Tests') {
        dotnet run --project "tests/$project" "--property:UmbracoVersion=$env:UMBRACO_RELEASE" -- -noLogo;
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      bump: auto
      releases: ${{ inputs.releases || '' }}
      dry-run: ${{ inputs.dry-run || false }}

name: CI

# Tests each pull request on the Umbraco release in Directory.Build.props, and merges a Dependabot update that passes.
# An update of a package a project under src references then starts the Release workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: Test
    runs-on: windows-latest
    # The three test projects take several minutes each.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: |
          foreach ($project in 'AppBlocks.Tests', 'AppBlocks.InteractiveReports.Tests', 'AppBlocks.Documents.Tests') {
            dotnet run --project "tests/$project" -- -noLogo
            if ($LASTEXITCODE -ne 0) { throw "$project failed." }
          }

      - name: Pack
        run: |
          foreach ($project in 'AppBlocks', 'AppBlocks.InteractiveReports', 'AppBlocks.Documents', 'AppBlocks.Testing') {
            dotnet pack "src/$project" -c Release -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "Could not pack $project." }
          }

  # A workflow that runs for Dependabot gets a read-only token unless the job asks for more.
  dependabot:
    name: Merge Dependabot update
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: auroris/AurorisNet.Build/actions/dependabot-release@main
